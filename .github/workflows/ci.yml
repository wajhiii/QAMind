name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # Windows: see the separate job below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Generated plugin is up to date with core/
        run: npm run check:generated
  # The memory, MCP server, fix-loop, auto-QA gate, lesson-review, setup, host-conformance, reliability (environment, budget, privacy, migration), bug-lifecycle, feedback, test-bank and CI tests on Windows. Allowed to fail until the owner has read the first results and decided to promote it
  # (see MAINTAINING.md). It skips the generated-plugin check: that compares bytes, and Windows checkouts may change line endings.
  windows-memory-server:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test --test-reporter=spec tests/core/memory.test.ts tests/core/memory-infra.test.ts tests/core/memory-lifecycle.test.ts tests/core/mcp-server.test.ts tests/core/mcp-stdio.test.ts tests/core/skills-use-tools.test.ts tests/core/fix-protect.test.ts tests/core/fix-hook.test.ts tests/core/fix-testrun.test.ts tests/core/fix-loop.test.ts tests/core/auto-qa-units.test.ts tests/core/auto-qa-gate.test.ts tests/core/auto-qa-skills.test.ts tests/core/lessons-review.test.ts tests/core/review-skill.test.ts tests/core/guard-and-hooks.test.ts tests/core/setup-ops.test.ts tests/core/setup-cli.test.ts tests/core/auto-qa-hosts.test.ts tests/conformance/hosts.test.ts tests/conformance/interop.test.ts tests/conformance/core-neutral.test.ts tests/core/reliability-env.test.ts tests/core/reliability-budget.test.ts tests/core/reliability-privacy.test.ts tests/core/memory-migration.test.ts tests/core/bug-lifecycle.test.ts tests/core/feedback.test.ts tests/core/test-bank.test.ts tests/core/ci.test.ts tests/core/ci-templates.test.ts tests/core/coverage-config.test.ts tests/core/visual.test.ts tests/core/perf.test.ts tests/core/mail.test.ts tests/core/ticket.test.ts tests/core/sweep.test.ts tests/core/coverage-hooks.test.ts tests/core/release-rules.test.ts tests/core/metrics.test.ts
