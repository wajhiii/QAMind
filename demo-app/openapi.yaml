openapi: 3.0.3
info:
  title: Lumen Supplies API
  version: 1.0.0
  description: |
    REST API for Lumen Supplies, a small B2B ordering system. Client accounts place and track orders for
    their own company. Admin accounts see every order, change order status, and read reports and customer records.

    **Pricing rules**
    - `subtotal` is the sum of `unit price x quantity` for every line.
    - An order whose subtotal is **1000.00 or more** gets a **5% discount** on the subtotal.
    - **Tax is 10%** and is applied to the **discounted** subtotal.
    - `total = subtotal - discount + tax`. Discount and tax are each rounded to the nearest cent.
    - All amounts are integer cents in USD.

    **Authentication**
    Call `POST /auth/login` and send the returned token as `Authorization: Bearer <token>`.
    A token is valid for `expires_in` seconds (15 minutes by default) and stops working as soon as the user
    signs out with `POST /auth/logout`.

    **Roles**
    - `client`: belongs to one company. Can read only that company's orders and can place orders.
    - `admin`: not tied to a company. Can read all orders and use every `/admin/...` endpoint.

    **Errors**
    Errors use the shape `{ "error": { "code": "...", "message": "..." } }`. Validation failures add a
    `details` array. Responses never include server internals such as stack traces or file paths.
servers:
  - url: http://127.0.0.1:4100/api
    description: Local demo server
tags:
  - name: Auth
  - name: Orders
  - name: Catalog
  - name: Admin
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Auth]
      summary: Service health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: The email or password is wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out and revoke the current token
      operationId: logout
      responses:
        '204':
          description: Signed out. The token no longer works.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: |
        Always answers 202 for a well-formed email address, whether or not an account exists, so the endpoint
        cannot be used to find out which addresses are registered. When an account exists, an email with a
        reset link to the client portal's `/reset-password.html?token=<token>` page is sent.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Choose a new password with a reset token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: The password was changed.
        '400':
          description: The token is invalid or expired, or the password is too short.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me:
    get:
      tags: [Auth]
      summary: The signed-in user
      operationId: getMe
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products:
    get:
      tags: [Catalog]
      summary: List products
      description: Available to any signed-in user.
      operationId: listProducts
      responses:
        '200':
          description: All products.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      description: |
        Clients see only their own company's orders. Admins see every order.
        Results are newest first. `q` is a case-insensitive text search over `reference` and `note`.
      operationId: listOrders
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: q
          in: query
          description: Text to search for in the reference and note.
          schema:
            type: string
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Orders]
      summary: Place an order
      description: Client accounts only. The order is created for the caller's company with status `placed`.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: The order was created.
          headers:
            Location:
              description: Path of the new order.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get one order
      description: |
        Clients can read only orders that belong to their own company; any other order answers 404, the same
        as an order that does not exist. Admins can read any order.
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/orders/{id}/status:
    patch:
      tags: [Admin]
      summary: Change an order's status
      description: |
        Admin only. Allowed moves: `placed` to `processing` or `cancelled`; `processing` to `shipped` or
        `cancelled`; `shipped` to `delivered`. `delivered` and `cancelled` are final. A client reading the
        order afterwards sees the new status.
      operationId: updateOrderStatus
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
      responses:
        '200':
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The order cannot move to that status from its current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/customers:
    get:
      tags: [Admin]
      summary: List customer records
      description: Admin only. Contact details for each client company.
      operationId: listCustomers
      responses:
        '200':
          description: All customers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports/sales:
    get:
      tags: [Admin]
      summary: Sales summary
      description: Admin only. Cancelled orders are not counted in `orders_count`, `gross_cents`, `by_client` or `top_products`.
      operationId: getSalesReport
      responses:
        '200':
          description: The sales summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Order id, for example `o-1001`.
      schema:
        type: string
  responses:
    ValidationError:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid bearer token was supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The signed-in user's role is not allowed to do this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Health:
      type: object
      required: [status, version, time]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        time:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [token, token_type, expires_in, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the token expires.
          example: 900
        user:
          $ref: '#/components/schemas/User'
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
    User:
      type: object
      required: [id, email, name, role, client_id, client_name]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, client]
        client_id:
          type: string
          nullable: true
        client_name:
          type: string
          nullable: true
    Product:
      type: object
      required: [id, sku, name, price_cents]
      properties:
        id:
          type: string
          example: p-101
        sku:
          type: string
        name:
          type: string
        price_cents:
          type: integer
          minimum: 0
    OrderStatus:
      type: string
      enum: [placed, processing, shipped, delivered, cancelled]
    OrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          description: Id of an existing product.
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
    OrderInput:
      type: object
      required: [reference, items]
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 64
          description: The client's own purchase order number.
        note:
          type: string
          maxLength: 500
          nullable: true
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemInput'
    OrderItem:
      type: object
      required: [product_id, name, unit_price_cents, quantity, line_total_cents]
      properties:
        product_id:
          type: string
        name:
          type: string
        unit_price_cents:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        line_total_cents:
          type: integer
    Order:
      type: object
      required: [id, reference, note, client_id, client_name, status, created_at, items, subtotal_cents, discount_cents, tax_cents, total_cents, currency]
      properties:
        id:
          type: string
          example: o-1001
        reference:
          type: string
        note:
          type: string
          nullable: true
        client_id:
          type: string
        client_name:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal_cents:
          type: integer
          description: Sum of the line totals.
        discount_cents:
          type: integer
          description: 5% of the subtotal when the subtotal is at least 100000 cents, otherwise 0.
        tax_cents:
          type: integer
          description: 10% of (subtotal - discount).
        total_cents:
          type: integer
          description: subtotal - discount + tax.
        currency:
          type: string
          enum: [USD]
    OrderList:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    StatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
    Customer:
      type: object
      required: [client_id, company, contact_name, email, phone, cnic, address, card_last4, notes]
      properties:
        client_id:
          type: string
        company:
          type: string
        contact_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        cnic:
          type: string
          description: National ID number of the contact.
        address:
          type: string
        card_last4:
          type: string
          pattern: '^[0-9]{4}$'
        notes:
          type: string
    SalesReport:
      type: object
      required: [generated_at, currency, orders_count, gross_cents, by_status, by_client, top_products]
      properties:
        generated_at:
          type: string
          format: date-time
        currency:
          type: string
          enum: [USD]
        orders_count:
          type: integer
        gross_cents:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_client:
          type: array
          items:
            type: object
            required: [client_id, client_name, orders, total_cents]
            properties:
              client_id:
                type: string
              client_name:
                type: string
              orders:
                type: integer
              total_cents:
                type: integer
        top_products:
          type: array
          items:
            type: object
            required: [product_id, name, quantity]
            properties:
              product_id:
                type: string
              name:
                type: string
              quantity:
                type: integer
