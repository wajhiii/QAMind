<!doctype html>
<html lang="en">
<head>
<title>Orders - Lumen Supplies Admin</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/admin.css">
<script src="/config.js"></script>
<script src="/lumen.js"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">Lumen Supplies<span class="portal-tag">Admin</span></a>
  <nav aria-label="Main">
    <a href="orders.html" aria-current="page">Orders</a>
    <a href="customers.html">Customers</a>
    <a href="reports.html">Reports</a>
  </nav>
  <div class="session">
    <span id="whoami" data-testid="whoami"></span>
    <button type="button" id="logout" class="link-button">Sign out</button>
  </div>
</header>
<main>
  <h1>Orders</h1>
  <div class="toolbar">
    <form id="search-form" role="search">
      <div class="field grow">
        <input id="search" name="q" type="search" placeholder="Search reference or note" data-testid="order-search">
      </div>
      <button type="submit" class="secondary" data-testid="search-submit">Search</button>
    </form>
    <div class="field">
      <label for="status-filter">Status</label>
      <select id="status-filter" data-testid="status-filter">
        <option value="">All statuses</option>
        <option value="placed">Placed</option>
        <option value="processing">Processing</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <button type="button" id="refresh" class="secondary icon-button" data-testid="refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button type="button" id="clear-filters" class="secondary icon-button" data-testid="clear-filters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="button" id="export-csv" data-testid="export-csv">Export CSV</button>
  </div>
  <p id="orders-error" class="form-error hidden" role="alert" data-testid="orders-error"></p>
  <div class="table-wrap">
    <table data-testid="orders-table">
      <thead>
        <tr><th scope="col">Reference</th><th scope="col">Client</th><th scope="col">Placed</th><th scope="col">Status</th><th scope="col" class="num">Total</th><th scope="col"><span class="sr-only">Actions</span></th></tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
  </div>
  <div class="pager">
    <span id="pager-info" class="muted" aria-live="polite"></span>
    <div class="buttons">
      <button type="button" id="prev-page" class="secondary">Previous</button>
      <button type="button" id="next-page" class="secondary">Next</button>
    </div>
  </div>
</main>
<script src="/orders.js"></script>
</body>
</html>
