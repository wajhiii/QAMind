<!doctype html>
<html lang="en">
<head>
<title>Choose a new password - Lumen Supplies</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/client.css">
<script src="/config.js"></script>
<script src="/lumen.js"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">Lumen Supplies<span class="portal-tag">Client</span></a>
</header>
<main>
  <section class="card narrow" aria-labelledby="reset-title">
    <h1 id="reset-title">Choose a new password</h1>
    <form id="reset-form" novalidate>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required data-testid="reset-password">
      <p id="reset-error" class="form-error hidden" role="alert"></p>
      <p id="reset-ok" class="form-success hidden" role="status"></p>
      <p><button type="submit" data-testid="reset-submit">Save password</button></p>
      <p><a href="index.html">Back to sign in</a></p>
    </form>
  </section>
</main>
<script src="/reset-password.js"></script>
</body>
</html>
