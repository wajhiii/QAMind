<!doctype html>
<html lang="en">
<head>
<title>Forgot password - Lumen Supplies</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/client.css">
<script src="/config.js"></script>
<script src="/lumen.js"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">Lumen Supplies<span class="portal-tag">Client</span></a>
</header>
<main>
  <section class="card narrow" aria-labelledby="forgot-title">
    <h1 id="forgot-title">Forgot your password?</h1>
    <p class="muted">Enter your email and we will send you a link to choose a new password.</p>
    <form id="forgot-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required data-testid="forgot-email">
      <p id="forgot-error" class="form-error hidden" role="alert"></p>
      <p id="forgot-ok" class="form-success hidden" role="status" data-testid="forgot-ok"></p>
      <p><button type="submit" data-testid="forgot-submit">Send reset link</button></p>
      <p><a href="index.html">Back to sign in</a></p>
    </form>
  </section>
</main>
<script src="/forgot-password.js"></script>
</body>
</html>
